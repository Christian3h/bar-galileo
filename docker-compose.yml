version: "3.9"
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bar_galileo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: django
      MYSQL_PASSWORD: django
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

  web:
    build: .
    depends_on:
      - db
    environment:
      DJANGO_SETTINGS_MODULE: bar_galileo.settings
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: bar_galileo
      DB_USER: django
      DB_PASSWORD: django
      DEBUG: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./bar_galileo:/app/bar_galileo:rw
      - static_volume:/app/bar_galileo/staticfiles
      - media_volume:/app/bar_galileo/media
    command: ["gunicorn", "bar_galileo.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]

volumes:
  db_data:
  static_volume:
  media_volume:
