upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name dominiopruebaprigma.xyz www.dominiopruebaprigma.xyz;

    client_max_body_size 50M;

    # Archivos estaticos: Nginx los sirve directamente sin tocar Python
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control public, immutable;
        access_log off;
    }

    # Archivos media (uploads)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control public;
        access_log off;
    }

    # WebSockets: deben pasar con upgrade
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade ;
        proxy_set_header Connection upgrade;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_read_timeout 86400;
    }

    # Todo lo demas va a Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host ;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_redirect off;
    }
}
