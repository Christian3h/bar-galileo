{% if field.errors %}
  <div class="form-group has-error">
{% else %}
  <div class="form-group">
{% endif %}
  <label class="form-label">{{ label }}</label>
  {{ field }}
  {% if field.errors %}
    <ul class="error-list">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
